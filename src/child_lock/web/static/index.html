<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차일드락 시뮬레이터</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6470; --line:#d6dbe1; --lock:#b42318; --release:#067647; --card:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --fg:#e6e9ed; --muted:#9aa4af; --line:#2a313a; --lock:#f97066; --release:#47cd89; --card:#171b21; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { font-size:15px; margin:0 0 8px; }
  label { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  input[type=number], select { width:120px; }
  button { padding:6px 12px; margin:4px 4px 0 0; cursor:pointer; }
  .doors { display:flex; gap:12px; margin-bottom:8px; }
  .door { flex:1; text-align:center; padding:12px; border-radius:6px; border:2px solid var(--line); font-weight:600; }
  .LOCK { border-color:var(--lock); color:var(--lock); } .RELEASE { border-color:var(--release); color:var(--release); }
  table { width:100%; border-collapse:collapse; font-size:12px; } td, th { border-bottom:1px solid var(--line); padding:3px 4px; text-align:left; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<h1>차일드락 시뮬레이터 <span class="muted">(PC/SIL, 시험용)</span></h1>
<div class="grid">
  <section>
    <h2>차량 입력</h2>
    <label>평가 시각 now_s [s] <input id="now_s" type="number" step="0.05" value="0"></label>
    <label>source_timestamp_s [s] <span class="muted">= now_s</span></label>
    <label>차속 [km/h] <input id="vehicle_speed_kph" type="number" step="0.1" value="0"></label>
    <label>기어 <select id="gear"><option>P</option><option>N</option><option>D</option><option>R</option></select></label>
    <label>충돌 <select id="crash_status"><option>NONE</option><option>PENDING</option><option>CONFIRMED</option></select></label>
    <div id="bools"></div>
    <button id="step">평가 (+50 ms)</button>
    <button id="tick">입력 없이 +50 ms</button>
  </section>
  <section>
    <h2>운전자 명령</h2>
    <label>도어 <select id="side"><option>left</option><option>right</option><option>all</option></select></label>
    <label>동작 <select id="action"><option>lock</option><option>unlock</option></select></label>
    <label>경로 <select id="source"><option>physical_button</option><option>avn</option><option>voice</option><option>mobile_app</option></select></label>
    <button id="send">명령과 함께 평가</button>
  </section>
  <section>
    <h2>상태</h2>
    <div class="doors"><div id="left" class="door">좌</div><div id="right" class="door">우</div></div>
    <table id="status"></table>
  </section>
</div>
<section style="margin-top:16px">
  <h2>최근 이벤트 <span class="muted">(최대 100건, 메모리)</span></h2>
  <table id="events"></table>
</section>
<script>
const BOOLS = ["ignition_on", "sensor_fault", "rear_left_approach_risk", "rear_right_approach_risk",
  "fire_detected", "overtemperature_detected", "adult_present", "isofix_left", "isofix_right"];
const $ = (id) => document.getElementById(id);
$("bools").innerHTML = BOOLS.map((b) =>
  `<label>${b} <input id="${b}" type="checkbox" ${b === "ignition_on" ? "checked" : ""}></label>`).join("");

function snapshot(withCommand) {
  const now = Number($("now_s").value);
  const s = { source_timestamp_s: now, vehicle_speed_kph: Number($("vehicle_speed_kph").value),
    gear: $("gear").value, crash_status: $("crash_status").value };
  BOOLS.forEach((b) => { s[b] = $(b).checked; });
  if (withCommand) s.command = { side: $("side").value, action: $("action").value, source: $("source").value };
  return s;
}
function render(st) {
  ["left", "right"].forEach((d) => { const v = st["lock_" + d]; $(d).className = "door " + v;
    $(d).textContent = (d === "left" ? "좌 " : "우 ") + v + " · " + st["reason_" + d]; });
  $("status").innerHTML = Object.entries(st).map(([k, v]) => `<tr><th>${k}</th><td>${v ?? "-"}</td></tr>`).join("");
}
async function refreshEvents() {
  const ev = await (await fetch("/api/events")).json();
  const cols = ["event_id", "now_s", "lock_left", "lock_right", "state", "reason_left", "reason_right", "input_validity"];
  $("events").innerHTML = `<tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr>` +
    ev.slice().reverse().map((e) => `<tr>${cols.map((c) => `<td>${e[c]}</td>`).join("")}</tr>`).join("");
}
async function step(snap) {
  const r = await fetch("/api/step", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ now_s: Number($("now_s").value), snapshot: snap }) });
  const body = await r.json();
  if (r.ok) render(body); else alert("요청 오류: " + JSON.stringify(body));
  $("now_s").value = (Number($("now_s").value) + 0.05).toFixed(2);
  refreshEvents();
}
$("step").onclick = () => step(snapshot(false));
$("tick").onclick = () => step(null);
$("send").onclick = () => step(snapshot(true));
fetch("/api/status").then((r) => r.json()).then(render);
refreshEvents();
</script>
</body>
</html>
